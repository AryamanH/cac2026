name: tiretrace
description: TireTrace prototype — runoff-aware route recommendations.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cloud_firestore: ^7.1.0
  cunning_document_scanner: ^3.0.3
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  geolocator: ^14.0.2
  google_fonts: ^8.2.1
  google_mlkit_commons: ^0.13.0
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.6.0
  latlong2: ^0.9.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
